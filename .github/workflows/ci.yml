name: CI/CD pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest            # Linux: faster and cheaper than macOS
    defaults:
      run:
        working-directory: frontend/docmind-frontend   # where package.json lives

    steps:                            # indented under the job, not at the left edge
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'          # your README requires Node 22.12+
          cache: npm
          cache-dependency-path: frontend/docmind-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci                   # name and run are ONE list item (no second dash)

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build

  backend:                            # indented under "jobs:"
    name: Backend
    runs-on: ubuntu-latest            # no working-directory: pom.xml is at the repo root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn -B clean verify