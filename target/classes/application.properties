# ==============================
# Database Configuration
# ==============================
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true


  # ==============================
  # Google Gemini AI Configuration
  # ==============================

spring.ai.google.genai.api-key=${API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.8-flash
spring.ai.google.genai.chat.options.temperature=0.2

spring.ai.google.genai.embedding.api-key=""
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
# Keep embeddings at a consistent size for the persisted local index.
spring.ai.google.genai.embedding.text.dimensions=1536

#====================================
#=======REDIS CONFIGURATION=========
#====================================

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=1s

spring.cache.type=redis
spring.cache.redis.time-to-live=10m
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=preproom:
  # ==============================
  # Local vector index
  # ==============================

app.vector-store.file=./data/vector-store.json


  # ==============================
  # Multipart Configuration
  # ==============================

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB


  # ==============================
  # Application Configuration
  # ==============================

app.rag.chunk-size=700
  # app.rag.chunk-overlap=100
app.rag.top-k=5
app.rag.similarity-threshold=0.0


  # ==============================
  # CORS Configuration
  # ==============================

app.cors.allowed-origins=http://localhost:3000
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*


  # ==============================
  # JWT Configuration
  # ==============================

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000


  # ==============================
  # Boot UI
  # ==============================

bootui.enabled=ON


  # ==============================
  # Logging
  # ==============================

logging.level.org.springframework.ai.chat.client.advisor=INFO
spring.ai.google.genai.chat.options.max-output-tokens=4096
spring.ai.google.genai.chat.options.timeout=90s
spring.ai.retry.max-attempts=2
