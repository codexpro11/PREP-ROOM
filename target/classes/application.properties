# ==============================
# Database Configuration
# ==============================
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ai_doc}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:atharva11}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true


  # ==============================
  # Google Gemini AI Configuration
  # ==============================

spring.ai.google.genai.api-key=${GEMINIAI_API_KEY:AQ.Ab8RN6Ld1Rs69SBqA-90RkPnzjkXyqnSibu6I17uC6RMk6pLqw}
spring.ai.google.genai.chat.options.model=${GEMINIAI_CHAT_MODEL:gemini-3.8-flash}
spring.ai.google.genai.chat.options.temperature=0.2

spring.ai.google.genai.embedding.api-key=${GEMINIAI_API_KEY:AQ.Ab8RN6Ld1Rs69SBqA-90RkPnzjkXyqnSibu6I17uC6RMk6pLqw}
spring.ai.google.genai.embedding.text.options.model=${GEMINIAI_EMBEDDING_MODEL:gemini-embedding-001}
# Keep embeddings at a consistent size for the persisted local index.
spring.ai.google.genai.embedding.text.dimensions=1536


  # ==============================
  # Local vector index
  # ==============================

app.vector-store.file=${VECTOR_STORE_FILE:./data/vector-store.json}


  # ==============================
  # Multipart Configuration
  # ==============================

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB


  # ==============================
  # Application Configuration
  # ==============================

app.rag.chunk-size=700
  # app.rag.chunk-overlap=100
app.rag.top-k=5
app.rag.similarity-threshold=0.0


  # ==============================
  # CORS Configuration
  # ==============================

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*


  # ==============================
  # JWT Configuration
  # ==============================

jwt.secret=${JWT_SECRET:eyJhbGciOiJIUzM4NCJ9.eyJzdWIiOiJhdGhhcnYiLCJpYXQiOjE3OTMyODYzMzUsImV4cCI6MTc5MzI4OTkzNX0.H--6Y8q4IQ2tyUX0rnwIgnmaEND44r-LKbyroWhgI_LxZZo5Qhxz7a7Yen7JcSYj}
jwt.expiration=3600000


  # ==============================
  # Boot UI
  # ==============================

bootui.enabled=ON


  # ==============================
  # Logging
  # ==============================

logging.level.org.springframework.ai.chat.client.advisor=INFO
spring.ai.google.genai.chat.options.max-output-tokens=4096
spring.ai.google.genai.chat.options.timeout=90s
spring.ai.retry.max-attempts=2
