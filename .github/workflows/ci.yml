
name: CI/CD pipeline

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main


jobs:
  frontend:
    name: Frontend
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend

  steps:
   - name: Checkout code
     uses: actions/checkout@v4

   - name: Setup Node.js
     uses: actions/setup-node@v4.0.0
     with:
       node-version: '20'
       cache: npm
       cache-dependency-path: frontend/package-lock.json

   - name: Install dependencies
   - run: npm ci                   # Clean install from package-lock.json (reproducible, unlike npm install)

   - name: Type check
   - run: npx tsc --noEmit         # Runs the TypeScript compiler to find type errors, but produces no files

   - name: Lint
   - run: npm run lint --if-present    # Runs your "lint" script if it exists, skips if not

   - name: Test
   - run: npm test --if-present        # Same idea for tests

   - name: Build
   - run: npm run build                # Produces the production bundle; fails if the build is broken


backend:
  name: Backend
  runs-on: macos-latest
  defaults:
    run:
      working-directory: backend

  services:
    postgres:
      image: postgres:16
      env:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: atharva11         # Database created on startup
      ports:
          - 5432:5432                 # Maps container port to the VM, so localhost:5432 works
      options: >-                   # Extra Docker flags (">-" just lets us write them on several lines)
            --health-cmd pg_isready
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Buildand test
        run: mvn -B clean verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ai_doc
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: test

